{% comment %} Structured data for the publication list, generated from
_data/publications.yml (the same file the visible list is built from). {% endcomment %}
{%- assign pubs = site.data.publications -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ItemList",
  "name": "Publications by {{ site.author.name }}",
  "numberOfItems": {{ pubs | size }},
  "itemListElement": [
    {%- for pub in pubs %}
    {
      "@type": "ListItem",
      "position": {{ forloop.index }},
      "item": {
        "@type": "ScholarlyArticle",
        "headline": {{ pub.title | jsonify }},
        "author": [
          {%- for name in pub.authors %}
          { "@type": "Person", "name": {{ name | jsonify }}{% if name == site.author.name %}, "url": "{{ site.url }}/"{% endif %} }{% unless forloop.last %},{% endunless %}
          {%- endfor %}
        ],
        "datePublished": {{ pub.date | jsonify }},
        "inLanguage": {{ pub.language | default: "en" | jsonify }},
        "url": {% if pub.links.paper %}{{ pub.links.paper | prepend: site.url | jsonify }}{% else %}{{ pub.links.arxiv | jsonify }}{% endif %}
        {%- if pub.kind == "journal" %},
        "isPartOf": { "@type": "Periodical", "name": {{ pub.venue_name | jsonify }} }
        {%- elsif pub.kind == "conference" %}
        {%- capture event %}{{ pub.venue_name }} ({{ pub.venue }}){% endcapture %},
        "isPartOf": { "@type": "CreativeWork", "name": {{ pub.container | default: event | jsonify }} }
        {%- endif %}
        {%- if pub.links.doi %},
        "sameAs": {{ pub.links.doi | jsonify }}
        {%- endif %}
      }
    }{% unless forloop.last %},{% endunless %}
    {%- endfor %}
  ]
}
</script>
