<meta charset="utf-8">

{% include seo.html %}

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- Inter is self-hosted (@font-face in _sass/_fonts.scss); preload the latin
     file so the swap from the system-font fallback happens as early as
     possible. Fonts always need crossorigin, even same-origin. -->
<link rel="preload" href="/assets/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="/assets/css/main.css?v={{ site.time | date: '%s' }}">

<link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
<link rel="manifest" href="/images/site.webmanifest">

<!-- browser chrome color follows the page background (--bg-page tokens in
     _theme.scss — keep the hex values in sync). The media split covers the
     pre-JS OS default; syncThemeColor below overrides both when a saved or
     toggled theme differs from the OS. -->
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7fb">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1115">

<!-- Apply the saved/OS color theme before first paint (no flash). Must stay
     inline here; every other script lives in assets/js/site.js. -->
<script>
  (function () {
    window.syncThemeColor = function (theme) {
      var color = theme === 'dark' ? '#0f1115' : '#f5f7fb';
      var metas = document.querySelectorAll('meta[name="theme-color"]');
      for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', color);
    };
    try {
      var saved = localStorage.getItem('theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      if (saved) window.syncThemeColor(saved); // manual choice may differ from the OS
    } catch (e) {}
  })();
</script>
