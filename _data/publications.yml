# Every paper, once. This file feeds
#   - the Publications list        (_includes/pub_short.md)
#   - its structured data          (_includes/publications-jsonld.html)
#   - the link rows of the tiles   (_includes/research.md via paper-links.html)
# in the order written here (newest first).
#
#   id          key the Experience tiles use: {% include paper-links.html id="..." %}
#   venue       the pill, e.g. "ISWC 2026" or "Under review"
#   kind        conference | journal | preprint
#   venue_name  full venue name printed after the authors (not for preprints)
#   container   only when the structured-data name differs from "venue_name (venue)"
#   title       without the final full stop
#   title_note  optional, set in italics after the title
#   language    optional, "en" unless given
#   authors     in paper order; the site owner's name is set in bold
#   date        publication date for the structured data: "YYYY", "YYYY-MM" or
#               "YYYY-MM-DD", always quoted
#   links       any of arxiv, paper, doi, code, demo, youtube, bilibili;
#               they are always shown in that order

