# Primary tabs. Rule: a tab that maps 1:1 to a section uses the exact
# section title. Home/Experience group several sections (see _pages/*.md).
main:
  - title: "Home"
    url: "/"

  - title: "Experience"
    url: "/experience/"

  - title: "Publications"
    url: "/publications/"

  - title: "Beyond"
    url: "/beyond/"

  # Feed is a separate site under /feed/ (its own repository and build), so
  # this tab is an ordinary link: a full page load, not a PJAX swap.
  - title: "Feed"
    url: "/feed/"
    full_load: true
