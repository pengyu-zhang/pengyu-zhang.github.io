# Site
title       : "Pengyu Zhang"
description : "Machine learning that stays accurate as data drifts."
url         : "https://pengyu-zhang.github.io"
baseurl     : ""   # explicit: otherwise jekyll-github-metadata fills it in and local production builds get a wrong prefix
repository  : "pengyu-zhang/pengyu-zhang.github.io"
timezone    : Europe/Amsterdam

google_site_verification : JQYCJePiikBIF4LcbMaXLkBezeiUW19_boIRD7N5nms

# GA4 measurement id; head.html emits the gtag snippet in production builds only
google_analytics         : G-9PGZPE733E

# Profile card and JSON-LD (read by author-profile.html and seo.html)
author:
  name          : "Pengyu Zhang"
  avatar        : "images/avatar.jpg"
  jobtitle      : "PhD Candidate in Computer Science"
  employer      : "University of Amsterdam"
  email         : "p.y.zhang3@gmail.com"
  googlescholar : "https://scholar.google.com/citations?user=xH7mJ-0AAAAJ"
  github        : "pengyu-zhang"
  linkedin      : "pengyuzhang03"
  orcid         : "https://orcid.org/0000-0001-5111-4487"
  researchgate  : "https://www.researchgate.net/profile/Pengyu-Zhang-38"

# Build. The four pages live in _pages/ (hence `include`); their content
# fragments are ordinary _includes/*.md. Everything else is a Jekyll default.
include:
  - _pages
# Jekyll 3 replaces its default exclude list with this one, so Gemfile and
# Gemfile.lock have to be named here or they are published.
exclude:
  - LICENSE
  - README.md
  - docker-compose.yml
  - Gemfile
  - Gemfile.lock
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
  # keep the PDFs out of sitemap.xml (jekyll-sitemap honours this key on static files)
  - scope:
      path: "pdf"
    values:
      sitemap: false
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
# the /about/ redirect stubs are enough; no redirects.json
redirect_from:
  json: false
