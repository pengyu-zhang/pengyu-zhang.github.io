# Build. The four pages live in _pages/ (hence `include`); their content
# fragments are ordinary _includes/*.md. Everything else is a Jekyll default.
include:
  - _pages
exclude:
  - LICENSE
  - README.md
  - docker-compose.yml
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
